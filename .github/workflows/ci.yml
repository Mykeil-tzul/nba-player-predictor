name: CourtIQ CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-training.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m src.train --demo
      - run: python -m src.predict --demo --player 1628369 --date 2025-02-08 --availability expected
